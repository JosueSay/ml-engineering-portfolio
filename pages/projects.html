<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.projects.title">Proyectos</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/branding.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />

    <link rel="modulepreload" href="../assets/js/app.js" />
    <link rel="modulepreload" href="../assets/js/layout.js" />
    <link rel="modulepreload" href="../assets/js/i18n.js" />
    <link rel="modulepreload" href="../assets/js/sidebar.js" />
    <link rel="modulepreload" href="../assets/js/theme.js" />
    <link rel="preload" as="fetch" type="application/json" crossorigin="anonymous" href="../assets/i18n/es.json" />
    <link rel="preload" as="fetch" type="application/json" crossorigin="anonymous" href="../assets/i18n/en.json" />
    <script>
      (function () {
        var t = localStorage.getItem("portfolio.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
  </head>
  <body data-page="projects">
    <main id="content">
      <div class="content-inner">
        <header class="page-header">
          <h1 data-i18n="page.projects.title">Proyectos</h1>
          <p class="page-header__subtitle" data-i18n="page.projects.subtitle">Trabajo aplicado de extremo a extremo, desde los datos hasta el despliegue.</p>
        </header>
        <div class="empty-state" data-i18n="page.empty">Contenido en camino. Pronto habrá material aquí.</div>
      </div>
    </main>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
