<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.caseStudies.title">Casos de Estudio</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/branding.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <script>
      (function () {
        var t = localStorage.getItem("portfolio.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
  </head>
  <body data-page="case-studies">
    <main id="content" hidden>
      <div class="content-inner">
        <header class="page-header">
          <h1 data-i18n="page.caseStudies.title"></h1>
          <p class="page-header__subtitle" data-i18n="page.caseStudies.subtitle"></p>
        </header>

        <section class="card-grid">
          <a class="card" href="cs1-fuel-prices.html">
            <p class="card__eyebrow" data-i18n="case.cs1.eyebrow"></p>
            <h2 class="card__title" data-i18n="case.cs1.title"></h2>
            <p class="card__desc" data-i18n="case.cs1.desc"></p>
          </a>

          <article class="card card--pending">
            <div class="card__head">
              <p class="card__eyebrow" data-i18n="case.cs2.eyebrow"></p>
              <span class="card__badge" data-i18n="case.status.pending"></span>
            </div>
            <h2 class="card__title" data-i18n="case.cs2.title"></h2>
            <p class="card__desc" data-i18n="case.cs2.desc"></p>
          </article>
        </section>
      </div>
    </main>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
