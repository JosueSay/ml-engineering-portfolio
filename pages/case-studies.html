<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.caseStudies.title">Casos de Estudio</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/branding.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <script>
      (function () {
        var t = localStorage.getItem("portfolio.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      })();
    </script>
  </head>
  <body data-page="case-studies">
    <main id="content" hidden>
      <div class="content-inner">
        <header class="page-header">
          <h1 data-i18n="page.caseStudies.title"></h1>
          <p class="page-header__subtitle" data-i18n="page.caseStudies.subtitle"></p>
        </header>
        <div class="empty-state" data-i18n="page.empty"></div>
      </div>
    </main>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
