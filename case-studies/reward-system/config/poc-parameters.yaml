# Parametros que el POC necesita y el banco no publica.
#
# Son supuestos del equipo. Viven aparte para que assumptions.yaml solo tenga
# lo verificable. Cada valor indica la pregunta abierta que lo reemplazaria:
# cuando haya respuesta se cambia aqui y el notebook corre igual.

meta:
  proposito: Parametros del equipo consultor para que la replica en miniatura pueda ejecutarse
  advertencia: >-
    Ningun valor de este archivo es un dato del sistema Puntos Bi. Todos son
    supuestos, y cada uno apunta a la pregunta abierta que lo reemplazaria.

# ---------------------------------------------------------------------------
# Sustitutos de preguntas abiertas
# ---------------------------------------------------------------------------

tipo_de_cambio_gtq_usd:
  valor: 7.70
  confianza: supuesto
  responde_a: P-3
  fuente: >-
    Tipo de cambio de referencia. El banco no publica con que tasa ni de que
    fecha convierte el consumo en quetzales a los dolares en que esta enunciada
    la regla de acumulacion. Es el parametro del que cuelga todo el saldo: a la
    tasa base, la diferencia entre dos tipos de cambio razonables mueve los
    puntos de todos los clientes.

saldos_promedio_gtq_por_punto:
  valor: 1000.0
  confianza: supuesto
  responde_a: P-2
  fuente: >-
    Dos ordenes de magnitud sobre la tasa de consumo, porque remunera un saldo
    retenido un mes y no un gasto puntual. El banco reconoce por escrito que
    hay tres reglas, una por tipo de cuenta, y no publica ninguna. El POC usa
    una sola para no fingir un detalle que no se conoce.
  nota: >-
    La relacion entre esta tasa y la de consumo es la que decide si el programa
    premia gastar o ahorrar. Con este valor, mantener Q1,000 de saldo promedio
    un mes rinde lo mismo que consumir unos Q7.70. Es una eleccion del equipo,
    no una medicion.

consumo_de_lotes:
  valor: fifo
  confianza: supuesto
  responde_a: P-4
  fuente: >-
    FIFO gasta primero lo que esta mas cerca de vencer, que es lo que conviene
    al cliente. Ninguna fuente publica dice cual se usa. Con un corte anual
    fijo, la diferencia entre FIFO y LIFO es dinero: bajo LIFO, un cliente que
    canjea con regularidad puede aun asi perder el lote viejo entero.

millas_por_punto_segun_origen:
  valor:
    credito_visa: 1.00
    debito_visa: 0.60
    debito_mastercard: 0.60
    credito_mastercard: 1.00
    dividelo_todo: 1.00
    saldo_promedio: 0.40
    campana: 1.00
    sorteo: 1.00
  confianza: supuesto
  responde_a: P-5
  fuente: >-
    Que la tasa varie segun el producto de origen es publico; cuanto varia, no.
    Estos valores existen para que el POC pueda demostrar la consecuencia de
    H-1: que dos grupos con el mismo saldo nominal no tienen el mismo poder de
    compra. La forma del hallazgo no depende de los numeros; la magnitud si, y
    por eso no se reporta magnitud.

cuenta_con_doble_por_membresia:
  valor: super_cuenta_ahorro
  confianza: supuesto
  responde_a: P-12
  fuente: >-
    Las preguntas frecuentes de Club Bi dicen Super Cuenta de Ahorros y la
    pagina de Bi Puntos dice cuenta monetaria. El POC toma la primera y aplica
    el doble a un solo tipo de cuenta, como dicen las dos fuentes por separado.

grano_del_tope_anual:
  valor: grupo_familiar
  confianza: supuesto
  responde_a: P-1
  fuente: >-
    El tope anual podria aplicarse por tarjeta, por cliente o por grupo
    unificado. El POC toma el grupo por coherencia con el grano del ledger, y
    el notebook muestra en una tabla cuanto cambia el resultado con las otras
    dos lecturas. Esa tabla es el argumento para que el cliente responda P-1.

exclusiones_programa:
  valor:
    - retiros de efectivo
    - extrafinanciamientos
  confianza: inferido
  responde_a: P-6
  fuente: >-
    Las dos unicas exclusiones publicas aparecen dentro de las bases de una
    promocion concreta, no como regla general del programa. El POC las aplica
    como si fueran generales porque es la lectura conservadora, y registra que
    el listado completo no es publico.

# ---------------------------------------------------------------------------
# Rubros del comercio
# ---------------------------------------------------------------------------
# Las cinco categorias reducidas son publicas; su mapa de codigos de rubro no.
# Este es el mapa estandar del sector.

rubros_de_tasa_reducida:
  valor:
    "5411": supermercados
    "5412": supermercados
    "5541": gasolineras
    "5542": gasolineras
    "5499": tiendas de conveniencia
    "8398": entidades de beneficencia
    "8220": centros educativos
    "8211": centros educativos
  confianza: inferido
  fuente: >-
    Correspondencia estandar entre codigos de rubro de la industria y las cinco
    categorias que el banco nombra en su nota al pie. El banco no publica su
    mapa; este es el que cualquier implementacion razonable usaria.
  nota: >-
    Aqui vive el riesgo de M1. Un comercio clasificado en 5411 en vez de 5812
    acumula la decima parte. El mapa importa tanto como la tasa.

rubros_excluidos:
  valor:
    "6011": retiros de efectivo
    "6010": retiros de efectivo
  confianza: inferido
  fuente: Codigos estandar de disposicion de efectivo.

# ---------------------------------------------------------------------------
# Simulador
# ---------------------------------------------------------------------------
# Controlan los datos sinteticos, no describen el sistema real.

simulacion:
  semilla: 20260922
  n_clientes: 700
  n_grupos_familiares: 240
  meses: 30
  inicio: "2024-01-01"
  # Defectos que se inyectan en los datos.
  tasa_duplicados: 0.03          # reintentos del autorizador
  tasa_reversas: 0.02            # anulaciones que llegan como fila aparte
  tasa_mcc_faltante: 0.12        # consumos sin codigo de rubro
  tasa_moneda_usd: 0.08          # consumos liquidados en dolares
  tasa_fuera_de_orden: 0.05      # el archivo no llega en orden de evento
  tasa_mastercard_no_afiliada: 0.65
  tasa_sin_membresia_club_bi: 0.55
  tasa_sin_bi_movil: 0.30
  # Latencia de acreditacion publicada: 48 a 72 horas habiles.
  latencia_habil_horas_min: 48
  latencia_habil_horas_max: 72
