# Catalogo de reglas del programa Puntos Bi, con su procedencia
#
# Este archivo es el entregable central de la fase de diagnostico. El encargo
# dice que los responsables de disenar e implementar el sistema ya no estan en
# la empresa, de modo que la primera pregunta no es como optimizarlo sino que
# hace, y con que evidencia se sostiene cada afirmacion.
#
# Cada entrada declara tres cosas:
#
#   valor      la regla
#   confianza  publico | inferido | supuesto
#   fuente     donde se verifica, o por que se eligio
#
# confianza:
#   publico   Citable de una fuente publica de Corporacion BI. Se defiende
#             ante el cliente sin matices.
#   inferido  No publicado como tal, pero se deduce de algo que si lo esta.
#             Se defiende explicando el razonamiento.
#   supuesto  Elegido por el equipo consultor. No se defiende como dato del
#             sistema, y ningun entregable lo presenta como tal.
#
# El reparto de niveles es en si mismo un hallazgo. La tasa de acumulacion
# existe y es publica, pero no vive en la pagina del programa: vive en una nota
# al pie con asterisco de cada pagina de producto. No hay ninguna fuente
# publica que enuncie la regla completa de una sola vez. Ver
# docs/report/03-hallazgos.md, H-2.
#
# Las fuentes completas, con fecha de consulta, estan en
# docs/report/05-referencias.md.

meta:
  programa: Puntos Bi (Club Bi)
  emisor: Corporacion BI / Banco Industrial, Guatemala
  fecha_consulta: "2026-09-22"
  alcance: >-
    Guatemala, tarjetas y cuentas de persona individual. Quedan fuera las
    tarjetas empresariales y las operaciones de Bi Bank Panama, que tienen sus
    propias condiciones.

# ---------------------------------------------------------------------------
# 1. Acumulacion transaccional
# ---------------------------------------------------------------------------

acumulacion_transaccional:

  tasa_base:
    valor: 1 punto por cada US$1 de compra
    puntos_por_dolar: 1.0
    confianza: publico
    fuente: >-
      Paginas de producto de Tarjetas Bi: "acumulas Puntos Bi por cada dolar de
      compra". Enunciada producto por producto, nunca en la pagina del
      programa.

  tasa_categorias_reducidas:
    valor: 1 punto por cada US$10 de compra
    puntos_por_dolar: 0.1
    categorias:
      - supermercados
      - gasolineras
      - tiendas de conveniencia
      - entidades de beneficencia
      - centros educativos
    confianza: publico
    fuente: >-
      Nota al pie identica en Visa Premier, Visa Signature, Visa Infinite y
      Mastercard Gold Internacional: "*Por cada 10 dolares de compra en
      supermercados, gasolineras, tiendas de conveniencia, entidades de
      beneficencia y centros educativos acumulas 1 punto."
    nota: >-
      Son las cinco categorias con tasa de intercambio regulada o reducida. El
      programa traslada esa economia al cliente sin decirlo: la penalizacion es
      de diez a uno y se comunica en un asterisco. Es la regla con mas impacto
      sobre el saldo de un cliente promedio, porque supermercado y gasolinera
      son el gasto recurrente tipico de una tarjeta.

  latencia_acreditacion:
    valor: entre 48 y 72 horas habiles
    horas_min: 48
    horas_max: 72
    dias_habiles: true
    confianza: publico
    fuente: >-
      FAQ del portal: "No, el proceso de acreditacion de Bi Puntos puede variar
      y en la mayoria de los casos tarda entre 48 y 72 horas (dias habiles)."
    nota: >-
      Ninguna via del sistema es sincrona. Esto descarta la lectura intuitiva de
      un motor que reacciona a cada autorizacion y confirma que la acumulacion
      se resuelve por lotes. Tambien cambia el argumento de H-7: el retardo de 48
      horas del sorteo no lo distingue de nada, porque todo el sistema acredita
      con retardo. Lo que lo distingue es que no se puede rederivar. Y para el
      cliente, 48 a 72 horas habiles pueden ser una semana de calendario.

  denominacion:
    valor: dolar estadounidense
    confianza: inferido
    fuente: >-
      La tasa se enuncia por dolar de compra, pero el consumo en Guatemala se
      liquida en quetzales. El motor tiene que convertir moneda antes de
      aplicar la tasa.
    nota: >-
      Ninguna fuente publica dice con que tipo de cambio se convierte ni de que
      fecha (el de la autorizacion, el del cierre del ciclo, uno institucional
      fijo). A la tasa base, la diferencia entre dos tipos de cambio razonables
      mueve el saldo del cliente. Ver H-4.

  topes_anuales:
    valor:
      mastercard_gold_internacional: 180000
      visa_premier: 180000
      visa_signature: 360000
      visa_infinite: 420000
    confianza: publico
    fuente: >-
      Paginas de producto: "Tope acumulacion hasta N Puntos Bi anualmente."
    nota: >-
      La categoria de tarjeta no cambia la tasa: cambia el techo. Es una
      decision de diseno distinta de la habitual en la region, donde la
      categoria multiplica la tasa. Aqui todos ganan lo mismo por dolar y las
      categorias altas solo pueden seguir ganando durante mas tiempo antes de
      topar.

  topes_no_publicados:
    valor:
      - Visa Clasica
      - Visa Platinum
      - Mastercard Standard
      - Mastercard Platinum
      - Mastercard Black
      - tarjetas de debito
    confianza: publico
    fuente: >-
      Ausencia verificada. Las paginas de estas categorias solo dicen "Acumulas
      Bi Puntos por compras, canjeables en establecimientos afiliados", sin
      tope ni tasa. Cuatro categorias publican tope; el resto no.

  grano_del_tope:
    valor: desconocido
    confianza: supuesto
    fuente: >-
      Pregunta abierta. El tope anual, es por tarjeta, por cliente o por grupo
      familiar unificado? Con unificacion familiar y varias tarjetas por
      persona, las tres respuestas dan saldos distintos. Es la primera pregunta
      del cuestionario al cliente.

  productos_que_acumulan:
    valor:
      credito_visa: [Clasica, Premier, Platinum, Signature, Infinite]
      debito_visa_bi_cheque: [Clasica, Oro, Platinum, Signature]
      debito_mastercard: [Standard, Platinum, Black]
      otros: [Dividelo Todo]
    confianza: publico
    fuente: >-
      Bases de promocion: "Aplica unicamente para Tarjetas de Credito Bi Visa
      de categorias Clasica, Premier, Platinum, Signature, Infinite y Tarjetas
      de Debito Individual Bi Cheque Visa Clasica, Bi Cheque Visa Oro, Bi
      Cheque Visa Platinum, Bi Cheque Visa Signature y las tarjetas de debito
      Bi Mastercard Standard, Platinum y Black que acumulen puntos."
    nota: >-
      La coletilla final, "que acumulen puntos", confirma que dentro de una
      misma categoria conviven tarjetas que acumulan y tarjetas que no. La
      elegibilidad no se deduce del producto: es un atributo por tarjeta.

  afiliacion_mastercard_credito:
    automatica:
      valor: false
      confianza: publico
      fuente: >-
        "Las tarjetas de credito Mastercard no acumulan Bi Puntos de forma
        automatica, sin embargo puedes solicitar este beneficio llamando al
        1717."
    canal_de_solicitud:
      # AMPLIADO en la tercera ronda: no es solo el telefono.
      valor: agencia o Contact Center (PBX 1717)
      confianza: publico
      fuente: >-
        Preguntas frecuentes de Club Bi: "Tarjetas de credito MasterCard se
        debera de solicitar por medio de agencia o Contact Center para
        acumular". El blog de 2022 solo mencionaba el 1717.
    reversible:
      valor: false
      confianza: publico
      fuente: La conversion no se deshace sin emitir una tarjeta nueva.
    excluye:
      valor: [Mastercard UEFA Champions League]
      confianza: publico
    tasa_mensual_al_afiliar:
      valor:
        mastercard_standard: 0.025
        mastercard_gold_internacional: 0.025
        mastercard_platinum: 0.022
        mastercard_black: 0.020
      confianza: publico
      fuente: >-
        Blog corporativo, enero de 2022: "Tasa de interes mensual del producto
        al momento de realizar la gestion para cambio de acumulacion de Bi
        Puntos."
      nota: >-
        CORREGIDO en la segunda ronda. La version anterior de este catalogo
        afirmaba que afiliarse encarece el credito. La fuente no lo dice: enuncia
        la tasa vigente al momento de la gestion, sin decir contra que se
        compara. Frente al tarifario actual, 2.5% mensual sobre una Mastercard
        Standard es MENOS que el 36% anual que hoy publica ese producto. Las dos
        cifras son de anios distintos y no son comparables limpiamente. Lo que si
        esta sostenido es que cambia las condiciones de forma irreversible y que
        la decision se toma por telefono. Ver P-7.

    ausencia_en_paginas_de_producto:
      valor: true
      confianza: publico
      fuente: >-
        Ausencia verificada sobre las ocho paginas de producto de tarjetasbi.com.
        Las cuatro Visa (Clasica, Premier, Platinum, Signature) listan "Acumulas
        Bi Puntos por compras, canjeables en establecimientos afiliados". Las
        cuatro Mastercard (Standard, Gold Internacional, Platinum, Black) listan
        exactamente los mismos beneficios menos esa linea.
      nota: >-
        Las paginas Mastercard no dicen que no acumulan: el beneficio no aparece,
        y tampoco aparece que se pueda solicitar. Un cliente que compara productos
        en el sitio del banco no tiene forma de enterarse de la afiliacion por
        1717. Ese dato vive unicamente en un blog de 2022. Ver P-10.

  comercios_aliados:
    # NUEVO en la tercera ronda. Es una via de acumulacion, no una variante del
    # consumo con tarjeta: el premio lo origina el comercio, no el producto
    # bancario, lo que implica un acuerdo comercial y una regla por comercio.
    valor: puntos adicionales al consumir con Tarjetas Bi en comercios aliados
    confianza: publico
    fuente: >-
      Infografia del boletin "Conoce los productos con lo que puedes acumular
      Puntos Bi": "Obtienes Puntos Bi adicionales al consumir con Tarjetas Bi en
      los comercios".
    listas_que_no_coinciden:
      infografia_del_boletin: [Cemaco, La Torre, Electronica Panamericana, La Curacao]
      pagina_bi_puntos: [Max, Cemaco, La Torre]
      faq_club_bi: [La Torre, Cemaco]
    tasa:
      valor: no publicada
      confianza: publico
    nota: >-
      Tres listas distintas del mismo emisor, leidas el mismo dia. No es un
      detalle de redaccion: si el motor aplica un factor por comercio, saber que
      comercios son es parte de la regla. Ver P-13.

  tarjeta_prepago_club_bi:
    # NUEVO en la tercera ronda.
    valor: acumula en mas de 1,000 establecimientos con POS Visa
    confianza: publico
    fuente: >-
      Blog corporativo, "Tu Club Bi tambien es Prepago": se puede pagar con la
      prepago Club Bi y "acumular Bi Puntos, en mas de 1,000 establecimientos
      que cuenten con POS Visa".
    tasa:
      valor: no publicada
      confianza: publico
    nota: >-
      Rompe el supuesto de que acumular exige una relacion de credito o una
      cuenta de deposito. Un instrumento prepago, recargable en agencias y en
      puntos "Tu Bi Aqui", tambien genera saldo de puntos.

  enumeracion_completa:
    # La unica fuente que enumera todas las vias en un solo lugar. Notese que no
    # esta en la pagina del programa sino en el FAQ del programa de beneficios.
    valor: >-
      Utilizando las tarjetas de credito y debito Visa, tarjetas debito
      MasterCard, Saldo promedio en Super Cuenta Monetaria y Ahorro, Cuenta
      Ahorro 5 Estrellas, todos los consumos que realizados con Dividelo Todo,
      consumiendo en comercios aliados (La Torre, Cemaco), Tarjetas de credito
      MasterCard se debera de solicitar por medio de agencia o Contact Center
      para acumular.
    confianza: publico
    fuente: Preguntas frecuentes de Club Bi, corporacionbi.com
    nota: >-
      De las ocho vias de acumulacion, una sola publica su tasa. Es H-2 en su
      forma mas cruda: no es que el programa esconda sus reglas, es que solo
      escribio una de ocho. Y la unica enumeracion completa vive en el FAQ de
      Club Bi, que es un programa distinto de Bi Puntos.

  exclusiones:
    valor:
      - retiros de efectivo
      - extrafinanciamientos
    confianza: publico
    fuente: >-
      Bases de promocion: "No aplica para retiros o extra financiamientos."
    nota: >-
      Enunciado dentro de las bases de una promocion concreta, no como regla
      general del programa. El listado completo de exclusiones del programa no
      es publico.

# ---------------------------------------------------------------------------
# 2. Acumulacion por saldos promedio
# ---------------------------------------------------------------------------

acumulacion_por_saldos:
  aplica_a:
    valor:
      - Super Cuenta Monetaria
      - Super Cuenta de Ahorro
      - Cuenta de Ahorro 5 Estrellas
    confianza: publico
    fuente: >-
      "La acumulacion de tus Bi Puntos es automatica, por cada transaccion de
      consumo que realices con tus tarjetas de credito y debito VISA, Dividelo
      Todo y por saldos promedios en tus Super Cuenta Monetaria, Super Cuenta
      de Ahorro y Cuenta de Ahorro 5 Estrellas."
  depositos_acumulan:
    valor: false
    confianza: publico
    fuente: >-
      FAQ del portal: "No, recuerda que los depositos a tus cuentas no acumulan
      Bi Puntos, acumulas Bi Puntos por los saldos promedio que mantienes."
    nota: >-
      Descarta que esta via reaccione a movimientos. Reacciona unicamente a un
      cierre de periodo.

  regla_por_tipo_de_cuenta:
    valor: true
    confianza: publico
    fuente: >-
      Nota al pie del mismo FAQ: "*Cada Cuenta tiene su propia Regla de
      Acumulacion."
    nota: >-
      El banco reconoce por escrito que no hay una regla sino tres, una por tipo
      de cuenta, y no publica ninguna de las tres. Convierte P-2 de una pregunta
      en tres.

  saldo_minimo_mensual_gtq:
    # AMPLIADO en la tercera ronda. La version anterior afirmaba que esta via no
    # tenia "ni una sola cifra publica". Si la tiene: el umbral desde el que
    # cada cuenta empieza a acumular esta publicado en la pagina de su producto.
    # Lo que sigue sin publicarse es la tasa.
    valor:
      super_cuenta_ahorro: 500.00
      super_cuenta_monetaria: 1000.00
      cuenta_ahorro_5_estrellas: 1000.00
    confianza: publico
    fuente: >-
      Paginas de producto. Super Cuenta Ahorro: "Ganas Bi Puntos sobre tu saldo
      promedio mensual mayor a Q500.00". Super Cuenta Monetaria: "Ganas Bi
      Puntos sobre tu saldo promedio mensual mayor a Q1,000.00". Ahorro 5
      Estrellas: "Puntos Bi por saldo promedio mensual a partir de Q.1,000.00".
    nota: >-
      Que los tres umbrales sean distintos confirma desde fuera lo que el
      asterisco del FAQ admite: son tres reglas, no una. Notese ademas que el
      umbral de la Super Cuenta Monetaria coincide con su deposito de apertura y
      con el saldo desde el que capitaliza intereses, lo que sugiere que el
      umbral de puntos reutiliza un parametro que ya existia en el producto.

  tasa:
    valor: no publicada
    confianza: publico
    fuente: >-
      Ausencia verificada. Ninguna fuente publica dice cuantos puntos genera un
      saldo promedio, para ninguna de las tres cuentas.
    nota: >-
      Se sabe desde donde se empieza a acumular y no se sabe cuanto se acumula,
      que es justo la mitad que le sirve al cliente para decidir. Es la unica
      via de acumulacion cuya tasa no aparece en ninguna fuente.

  multiplicador_por_membresia:
    # NUEVO en la tercera ronda.
    valor: dobles Bi Puntos con membresia Club Bi vigente
    factor: 2.0
    confianza: publico
    fuente: >-
      Preguntas frecuentes de Club Bi: hay que mantener la membresia activa para
      gozar de dobles Bi Puntos en la Supercuenta de Ahorros. La pagina de Bi
      Puntos dice lo mismo pero sobre la cuenta monetaria: "Si tienes membresia
      Club Bi activa, acumulas dobles Bi Puntos con tu cuenta monetaria".
    contradiccion: >-
      Las dos fuentes del emisor no coinciden en que cuenta recibe el doble. Ver
      P-12.
    nota: >-
      Corrige el alcance de lo dicho en costos.participar_en_bi_puntos. La
      membresia no solo condiciona la capa promocional: compra un multiplicador
      permanente sobre una via de acumulacion. La pregunta economica deja de ser
      "vale la pena pagar Q180 al anio por descuentos" y pasa a ser "vale la
      pena por descuentos mas el doble de puntos sobre el saldo promedio", que
      no se puede responder porque la tasa base de esa via no es publica.
  periodicidad:
    valor: mensual, sobre el saldo promedio del mes cerrado
    confianza: inferido
    fuente: >-
      "Saldo promedio" solo tiene sentido sobre un periodo cerrado, y el ciclo
      natural de una cuenta de deposito es el mes.
    nota: >-
      Este mecanismo no reacciona a un evento: reacciona a un cierre. Es la
      razon por la que el saldo de puntos es la suma de un flujo y un lote, y
      por la que las dos mitades no se pueden reconciliar con el mismo reloj.

# ---------------------------------------------------------------------------
# 3. Promociones
# ---------------------------------------------------------------------------
# Una capa entera de reglas temporales encima de la tasa base. Es la parte del
# sistema que mas maquinaria exige y la que menos documentada esta.

promociones:
  mecanicas_observadas:
    valor:
      - multiplicador general sobre todo consumo
      - multiplicador por categoria de comercio y fecha
      - bonificacion equivalente al monto del ticket
      - sorteo con ganadores aleatorios
    confianza: publico

  ejemplo_multiplicador:
    valor:
      nombre: Dobles y triples Puntos Bi
      vigencia: 1 al 31 de julio de 2025
      mecanica: >-
        Dobles puntos en todo consumo con Tarjetas Bi Visa de credito y debito.
        Triples puntos los fines de semana por rubro y fecha: electrodomesticos
        5 y 6 de julio, restaurantes 12 y 13, ropa 19 y 20, entretenimiento 26
        y 27.
      tope_por_cliente: 1500
      requiere_inscripcion: true
    confianza: publico

  ejemplo_bonificacion:
    valor:
      nombre: Tus compras se transforman en Puntos Bi
      vigencia: 27 de junio al 5 de agosto de 2022
      mecanica: 1 punto por cada quetzal consumido, si la compra resulta premiada
      consumo_minimo_por_transaccion_gtq: 300
      tope_diario: 800
      tope_mensual: 30000
      requiere_membresia_club_bi_vigente: true
      requiere_bi_movil_activo: true
    confianza: publico
    nota: >-
      Un punto por quetzal es cerca de ocho veces la tasa base, que es un punto
      por dolar. La promocion no multiplica la tasa: la sustituye y le cambia
      la moneda. El motor tiene que soportar que la unidad de la regla cambie,
      no solo su coeficiente.

  ejemplo_sorteo:
    valor:
      nombre: Gana hasta 50,000 Bi Puntos
      vigencia: 15 de junio al 31 de julio de 2021
      consumo_minimo_gtq: 100
      premios:
        - 100 ganadores diarios de 500 puntos
        - 50 ganadores diarios de 1,000 puntos
        - 10 premios semanales de 10,000 puntos
        - 5 premios mensuales de 50,000 puntos
      acreditacion: 48 horas despues de la notificacion por SMS
      requiere_bi_movil_activo: true
      excluye: empleados de la corporacion
    confianza: publico
    nota: >-
      La mecanica mas exigente para el sistema y la menos visible. Acredita
      puntos que no se derivan del consumo, con un retardo de 48 horas y
      disparados desde un canal externo. Es una via de acreditacion asincrona y
      no reproducible: si el registro del sorteo se pierde, el saldo no se
      puede reconstruir desde las transacciones. Ver H-7.

  requisitos_recurrentes:
    valor:
      - membresia Club Bi vigente
      - servicio Bi Movil activo
      - inscripcion previa a la promocion
    confianza: publico
    nota: >-
      Los tres son predicados de elegibilidad que viven fuera del dato de la
      transaccion: estado de una membresia, estado de un servicio digital y
      pertenencia a un padron. El motor tiene que consultarlos en el momento de
      acreditar, contra sistemas que no son el autorizador.

# ---------------------------------------------------------------------------
# 4. Costo de participar
# ---------------------------------------------------------------------------

costos:

  # CORREGIDO en la segunda ronda. La version anterior de este catalogo
  # afirmaba que el programa de lealtad es una suscripcion de pago de Q180 al
  # anio. Es falso: el banco publica lo contrario. Son dos programas distintos
  # que comparten nombre comercial, tarjeta fisica y usuario del portal.

  participar_en_bi_puntos:
    valor: gratuito
    confianza: publico
    fuente: >-
      FAQ del portal: "Si, aun puedes realizar el canje de tus Bi Puntos, ya que
      el Programa de Bi Puntos es ajeno al Programa de beneficios que otorga Club
      Bi al pagar tu membresia."
    nota: >-
      Acumular y canjear no cuesta nada. Tres matices que si se sostienen: la
      Tarjeta Club Bi fisica sigue siendo obligatoria para canjear ("en ella se
      depositan todos tus Bi Puntos"); varias promociones si exigen membresia
      Club Bi vigente; y la membresia da dobles puntos sobre la acumulacion por
      saldo promedio (ver acumulacion_por_saldos.multiplicador_por_membresia).
      AMPLIADO en la tercera ronda: la membresia no compra el acceso al programa
      base, pero si compra un multiplicador permanente sobre una de las ocho
      vias, no solo acceso a promociones temporales.

  membresia_club_bi_mensual_gtq:
    valor: 15.00
    aplica_a: Club Bi, programa de beneficios y descuentos
    confianza: publico
    fuente: >-
      Pagina de Club Bi: "La membresia Club Bi tiene un costo de Q15.00
      mensuales."
    nota: >-
      Q180 al anio por el programa de beneficios. NO es el precio de participar
      en Bi Puntos.

  tarifario_tarjetas:
    confianza: publico
    fuente: >-
      Las ocho paginas de producto de tarjetasbi.com, bloque de condiciones.
      Todas traen el mismo cuadro, de modo que la comparacion es limpia.
    unidades:
      interes_anual_q: tasa nominal anual en quetzales
      interes_anual_usd: tasa nominal anual en dolares
      membresia_gtq: membresia anual
      extorno_gtq: consumo anual minimo para extorno de membresia
      extrafinanciamiento_mensual: tasa mensual de extrafinanciamiento
    valor:
      visa_clasica:
        interes_anual_q: 0.6000
        interes_anual_usd: 0.33
        membresia_gtq: 420
        extorno_gtq: 6750
        extrafinanciamiento_mensual: 0.0317
        acumula: true
      visa_premier:
        interes_anual_q: 0.4860
        interes_anual_usd: 0.30
        membresia_gtq: 420
        extorno_gtq: 20700
        extrafinanciamiento_mensual: 0.0267
        acumula: true
      visa_platinum:
        interes_anual_q: 0.4740
        interes_anual_usd: 0.27
        membresia_gtq: 610
        extorno_gtq: 54000
        extrafinanciamiento_mensual: 0.0217
        acumula: true
      visa_signature:
        interes_anual_q: 0.4020
        interes_anual_usd: 0.24
        membresia_gtq: 1200
        extorno_gtq: 78000
        extrafinanciamiento_mensual: 0.0183
        acumula: true
      mastercard_standard:
        interes_anual_q: 0.3600
        interes_anual_usd: 0.36
        membresia_gtq: 420
        extorno_gtq: 6750
        extrafinanciamiento_mensual: 0.0317
        acumula: false
      mastercard_gold_internacional:
        interes_anual_q: 0.3200
        interes_anual_usd: 0.32
        membresia_gtq: 420
        extorno_gtq: 3500
        extrafinanciamiento_mensual: 0.0267
        acumula: false
      mastercard_platinum:
        interes_anual_q: 0.2700
        interes_anual_usd: 0.27
        membresia_gtq: 610
        extorno_gtq: 54000
        extrafinanciamiento_mensual: 0.0217
        acumula: false
      mastercard_black:
        interes_anual_q: 0.2400
        interes_anual_usd: 0.24
        membresia_gtq: 1200
        extorno_gtq: 78000
        extrafinanciamiento_mensual: 0.0183
        acumula: false
    nota: >-
      Las dos marcas estan emparejadas por nivel: misma membresia, mismo extorno,
      mismo extrafinanciamiento. Lo unico que cambia sistematicamente entre cada
      par es la tasa en quetzales y la acumulacion de puntos. El par de entrada
      lo muestra: Visa Clasica y Mastercard Standard comparten Q420, Q6,750 y
      3.17% mensual, y se separan en 60% contra 36% anual, con la que acumula
      siendo la cara. Para un cliente que financia saldo, un retorno de ~0.8% del
      consumo no compensa 24 puntos porcentuales de tasa. Para quien paga de
      contado el razonamiento no aplica: el hallazgo es condicional.
      Son tasas nominales; no incluyen comisiones, seguros ni el efecto de los
      dias de financiamiento sin intereses.

# ---------------------------------------------------------------------------
# 5. Vigencia y expiracion
# ---------------------------------------------------------------------------

vigencia:
  anios:
    valor: 2
    confianza: publico
  corte:
    valor: 5 de febrero de cada anio, para lo acumulado dos anios antes
    mes: 2
    dia: 5
    confianza: publico
    fuente: >-
      "Los Bi Puntos tienen una vigencia de dos anios y vencen el 5 de febrero
      de cada anio los acumulados dos anios antes."
    nota: >-
      No es un vencimiento rodante por punto: es un corte anual en fecha fija
      por anio de acumulacion. La vigencia efectiva va de 13 a 25 meses segun
      el mes en que se gano el punto, y el programa la comunica como "dos
      anios" a todos por igual. Ver H-3.
  consumo_de_lotes:
    valor: desconocido
    confianza: supuesto
    fuente: >-
      Ninguna fuente publica dice que puntos se gastan primero al canjear. Con
      un corte anual fijo, la diferencia entre gastar primero los mas viejos y
      gastar primero los mas nuevos es dinero del cliente. Pregunta abierta.

# ---------------------------------------------------------------------------
# 6. Titularidad del saldo
# ---------------------------------------------------------------------------

unificacion_familiar:
  parentescos_admitidos:
    valor: [padre, madre, hermanos, conyuge]
    confianza: publico
    fuente: >-
      "Puedes realizar el traslado total de tus Bi Puntos por medio de una
      unificacion de Bi Puntos familiar con miembros de tu circulo familiar
      como Padre, Madre, Hermanos y Esposo (comprobado con Acta Matrimonial)."
    nota: >-
      El conyuge se acredita con acta matrimonial, lo que deja fuera la union
      de hecho, figura reconocida por la legislacion guatemalteca.
  permanencia_minima_meses:
    valor: 12
    confianza: publico
    fuente: >-
      "El canje de Bi Puntos lo podra realizar unicamente el titular de la
      unificacion familiar y dicha unificacion debera permanecer como minimo un
      anio."
  canjea:
    valor: solo el titular de la unificacion
    confianza: publico
    nota: >-
      El saldo pertenece a un grupo y lo ejerce una persona. Cualquier analisis
      por cliente cuenta puntos que ese cliente no puede canjear.

# ---------------------------------------------------------------------------
# 7. Canje
# ---------------------------------------------------------------------------

canje:
  canales_de_consulta:
    valor:
      - App Club Bi
      - Bi en Linea web
      - Portal bipuntos.bi.com.gt
      - Centros de canje
      - PBX 1717
      - Estado de cuenta Bi Puntos
    confianza: publico
  canales_de_ejecucion:
    # CORREGIDO en la segunda ronda. La version anterior listaba un unico canal
    # presencial. Hay tres, y dos no estan documentados.
    valor:
      presencial:
        canal: Centros de canje
        alcance: todo el catalogo
        confianza: publico
        fuente: >-
          "Visita un centro de canje y presenta tu Tarjeta Club Bi fisica y tu
          documento de identificacion."
      en_linea:
        canal: Portal bipuntos.bi.com.gt, tras iniciar sesion
        alcance: no publicado
        confianza: publico
        fuente: >-
          El portal tiene la entrada de menu "Canje en linea" y el aviso "Para
          poder canjear premios debes iniciar sesion". Ninguna fuente publica
          dice que parte del catalogo admite.
      telefonico:
        canal: PBX 1717
        alcance: conversion a millas LifeMiles
        confianza: publico
        fuente: 'Portal de millas: "Para canjear tus puntos llama al 1717."'
    nota: >-
      El problema no es que haya una sola via: es que hay tres y el cliente solo
      conoce una. Toda la documentacion publica describe el mostrador. Es otra
      manifestacion de H-2, la regla que gobierna la funcionalidad existente no
      esta escrita. Ver H-8 y P-8.

  valor_del_punto:
    valor:
      puntos: 1615
      equivale_a_gtq: 100
      premio: Certificado de Regalo
      gtq_por_punto: 0.0619
    confianza: publico
    fecha_de_lectura: "2026-09-22"
    fuente: >-
      Portada de bipuntos.bi.com.gt, bloque "Premios destacados": "1615 puntos -
      Certificado de Regalo por Q100". Confirmado por la pagina del programa:
      "Puedes obtener certificados de regalo desde Q100."
    nota: >-
      Primer valor monetario del punto en todo el caso. Hasta esta ronda el
      diagnostico razonaba sobre cuantos puntos se ganan, nunca sobre cuanto vale
      uno. Expresar el retorno como porcentaje del consumo exige el tipo de
      cambio no publico (P-3), asi que cualquier porcentaje es ilustracion y no
      dato. ADVERTENCIA DE VIGENCIA, el catalogo de premios cambia y hay que
      releerlo antes de reutilizar esta cifra. El PDF de arquitectura registra
      1595 puntos para el mismo certificado, probablemente una lectura anterior.

  retorno_ilustrativo:
    valor:
      tasa_base: 0.0080
      tasa_reducida: 0.0008
    confianza: supuesto
    depende_de:
      tipo_de_cambio_gtq_usd: 7.70
    fuente: >-
      Calculo del equipo consultor: Q0.0619 por punto sobre Q7.70 de consumo por
      punto en tasa base. El tipo de cambio es de referencia; NO es el tipo de
      cambio de acumulacion del banco, que no es publico.
    nota: >-
      Se publica como orden de magnitud para poder dimensionar H-1 y H-6, que
      hasta ahora se argumentaban sin ninguna cifra de valor. Mover el tipo de
      cambio dentro de un rango razonable no cambia el orden: el programa
      devuelve menos del uno por ciento en su tasa buena y menos de una decima de
      punto porcentual en supermercado y gasolinera. Ningun entregable presenta
      estas cifras como dato del sistema.
  requisitos:
    valor:
      titular: [Tarjeta Club Bi fisica, documento de identificacion]
      tercero:
        - carta de autorizacion firmada por el titular
        - copia del DPI del titular
        - Tarjeta Club Bi fisica
      empresa:
        - copia del DPI del representante legal
        - nombramiento
        - Tarjeta Club Bi fisica
    confianza: publico
  comercios_afiliados:
    valor: mas de 50
    confianza: publico
  conversion_a_millas:
    socio:
      valor: LifeMiles
      confianza: publico
    tasa_varia_por_producto:
      valor: true
      confianza: publico
      fuente: >-
        Portal de millas: la conversion "puede variar segun el producto con el
        que acumules Bi Puntos".
      nota: >-
        El hallazgo central del caso. Si el valor de canje depende del producto
        que genero el punto, entonces los puntos no son intercambiables entre
        si, y el numero unico que muestran los seis canales de consulta no
        alcanza para decidir un canje. Ver H-1.
    tasa:
      valor: no publicada
      confianza: publico

# ---------------------------------------------------------------------------
# 8. Identidad y acceso
# ---------------------------------------------------------------------------

identidad:
  portal_con_registro_propio:
    valor: true
    confianza: publico
    fuente: >-
      bipuntos.bi.com.gt tiene alta de usuario y recuperacion de contrasena
      propias, distintas de las de Bi en Linea.
  portal_longitud_minima_password:
    valor: 4
    confianza: publico
    fuente: >-
      El portal exige mayusculas, minusculas, numeros y caracteres especiales,
      y a la vez admite un minimo de 4 caracteres.
    nota: >-
      La composicion obligatoria no compensa la longitud. Con cuatro caracteres
      el espacio de busqueda sigue siendo pequeno, y ademas obligar a que
      aparezcan cuatro clases distintas en cuatro posiciones reduce el conjunto
      de contrasenas validas en vez de ampliarlo. Ver H-5.

# ---------------------------------------------------------------------------
# 9. Preguntas abiertas para el cliente
# ---------------------------------------------------------------------------
# Lo que no se puede responder desde fuera y hay que preguntar. Van ordenadas
# por cuanto cambia la respuesta el resto del diagnostico.
#
# La numeracion salta de P-6 a P-12 a proposito: P-7 a P-11 nacieron en la
# segunda ronda de investigacion y viven en docs/investigacion-y-supuestos.md,
# seccion 7. No se duplican aqui para que cada pregunta tenga un solo lugar
# donde se mantiene. El cuestionario completo al cliente son las trece.

preguntas_abiertas:
  - id: P-1
    pregunta: El tope anual, se aplica por tarjeta, por cliente o por grupo familiar?
    por_que_importa: >-
      Las tres respuestas dan saldos distintos para el mismo consumo, y cambian
      por completo el modelo de datos del acumulador.
  - id: P-2
    pregunta: Cual es la tasa de acumulacion por saldo promedio?
    por_que_importa: >-
      Es el unico mecanismo sin cifra publica. Sin el no se puede saber si el
      programa premia gastar o ahorrar.
  - id: P-3
    pregunta: Con que tipo de cambio y de que fecha se convierte el consumo en quetzales a dolares?
    por_que_importa: Mueve el saldo de todos los clientes en todas las transacciones.
  - id: P-4
    pregunta: Al canjear, que lote de puntos se consume primero?
    por_que_importa: >-
      Con un corte anual fijo, el orden decide cuantos puntos pierde un cliente
      que canja con regularidad.
  - id: P-5
    pregunta: Cuales son las tasas de conversion a millas por producto de origen?
    por_que_importa: >-
      Es lo que convierte el saldo unico en una cifra que no basta para decidir.
  - id: P-6
    pregunta: Existe el listado completo de exclusiones del programa, fuera de las bases de cada promocion?
    por_que_importa: >-
      Hoy solo hay exclusiones citadas dentro de promociones concretas, lo que
      sugiere que la regla general no esta escrita en ningun lado.
  - id: P-12
    pregunta: El doble por membresia Club Bi, sobre que cuenta aplica?
    por_que_importa: >-
      Las preguntas frecuentes de Club Bi dicen Super Cuenta de Ahorros y la
      pagina de Bi Puntos dice cuenta monetaria. Son dos fuentes del mismo
      emisor diciendo cosas distintas sobre un multiplicador de dos. Un cliente
      que paga la membresia para duplicar sus puntos no puede saber en cual de
      sus cuentas conviene dejar el saldo.
  - id: P-13
    pregunta: Cuales son los comercios aliados y cuanto acreditan de mas?
    por_que_importa: >-
      Hay tres listas publicas distintas y ninguna tasa. Si el motor aplica un
      factor por comercio, la lista es parte de la regla de acumulacion y hoy no
      se puede reconstruir desde fuera.
