[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-price-gt"
version = "0.1.0"
description = "Extracción, pronóstico y recomendación de precios de combustible en Guatemala"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "joblib>=1.3", "numpy>=1.26", "opencv-python-headless>=4.9",
  "pandas>=2.1", "pillow>=10", "pillow-heif>=0.16", "PyYAML>=6", "requests>=2.31",
  "scikit-learn>=1.4", "uvicorn>=0.27", "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
fuel-price-gt = "fuel_price_gt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S: seguridad (credenciales embebidas, subprocess y deserializacion inseguros).
# N: nomenclatura.
# D: documentacion. Se exige que exista, no como esta redactada.
select = ["E", "F", "W", "I", "N", "S", "UP", "B", "D"]
ignore = [
  "E501",   # la longitud la controla el formateador
  "B008",   # llamadas en valores por defecto: patron normal de FastAPI
  "D105",   # metodos magicos: su nombre ya dice que hacen
  "D107",   # el constructor se documenta en la clase, no dos veces
  "D203", "D212", "D400", "D401", "D415",  # formato, no contenido
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Las aserciones son el mecanismo normal de las pruebas, y una prueba se
# documenta con su nombre.
"tests/**" = ["S101", "D"]
