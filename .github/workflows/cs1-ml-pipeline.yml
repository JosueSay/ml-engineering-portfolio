name: CS1 - Pipeline MLOps Gasolina GT

# El flujo llama a los scripts del proyecto, no a make: el mismo comando corre
# igual en cualquier maquina sin necesidad de tener make instalado.
#
# Las fotografias no estan en el repositorio. Cuando no hay fuente de datos
# disponible, las etapas que dependen de ellas se omiten de forma explicita y
# el motivo queda escrito en el resumen de la corrida. Un pipeline en verde que
# no proceso nada seria peor que uno que falla.

on:
  push:
    branches: [main, fuel-case-study]
    paths:
      - "case-studies/cs1/**"
      - ".github/actions/setup-cs1-env/**"
      - ".github/workflows/cs1-ml-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "case-studies/cs1/**"
      - ".github/actions/setup-cs1-env/**"
      - ".github/workflows/cs1-ml-pipeline.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      fuel:
        description: Combustible a entrenar
        type: choice
        options: [regular, super, diesel, vpower]
        default: regular
      horizon:
        description: Horizonte de prediccion en semanas
        type: choice
        options: ["1", "2", "4"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FUEL: ${{ inputs.fuel || 'regular' }}
  HORIZON: ${{ inputs.horizon || '1' }}
  RETENTION_DAYS: 14

defaults:
  run:
    working-directory: case-studies/cs1

jobs:
  # ---------------------------------------------------------------------------
  # Siempre corre: no depende de que haya datos.
  # ---------------------------------------------------------------------------
  code-quality:
    name: 1. Calidad de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Puertas de calidad
        run: bash scripts/03_gates.sh

  # ---------------------------------------------------------------------------
  # Decide si hay de donde sacar fotografias. Es el unico sitio donde se toma
  # esa decision; el resto de trabajos la consultan.
  # ---------------------------------------------------------------------------
  data-source:
    name: 2. Fuente de datos
    runs-on: ubuntu-latest
    needs: code-quality
    outputs:
      hay_datos: ${{ steps.decidir.outputs.hay_datos }}
      motivo: ${{ steps.decidir.outputs.motivo }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Preparar credenciales
        run: bash scripts/02_keys_init.sh
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          OBJECT_STORE_CREDENTIALS: ${{ secrets.OBJECT_STORE_CREDENTIALS }}

      - name: Determinar si hay fotografias disponibles
        id: decidir
        run: |
          locales=$(find data/raw -type f \( -iname '*.heic' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) 2>/dev/null | wc -l)
          if [ "$locales" -gt 0 ]; then
            echo "hay_datos=true" >> "$GITHUB_OUTPUT"
            echo "motivo=$locales imagen(es) en data/raw" >> "$GITHUB_OUTPUT"
          elif [ -s keys/google-drive-service-account.json ] && [ -f scripts/10_ingest_images.py ]; then
            echo "hay_datos=true" >> "$GITHUB_OUTPUT"
            echo "motivo=credencial remota disponible y el paso de ingesta existe" >> "$GITHUB_OUTPUT"
          elif [ -s keys/google-drive-service-account.json ]; then
            # Tener la credencial no basta: sin el paso que la usa para
            # descargar, la extraccion correria sobre una carpeta vacia.
            echo "hay_datos=false" >> "$GITHUB_OUTPUT"
            echo "motivo=hay credencial remota pero todavia no existe el paso de ingesta" >> "$GITHUB_OUTPUT"
          else
            echo "hay_datos=false" >> "$GITHUB_OUTPUT"
            echo "motivo=data/raw esta vacia y no hay credencial de almacenamiento remoto" >> "$GITHUB_OUTPUT"
          fi

      - name: Dejar constancia en el resumen
        run: |
          {
            echo "## Fuente de datos"
            echo
            if [ "${{ steps.decidir.outputs.hay_datos }}" = "true" ]; then
              echo "Disponible: ${{ steps.decidir.outputs.motivo }}."
            else
              echo "**No disponible**: ${{ steps.decidir.outputs.motivo }}."
              echo
              echo "Las etapas de extraccion, transformacion, entrenamiento y evaluacion"
              echo "se omiten en esta corrida. La calidad de codigo y la imagen de"
              echo "contenedor si se verifican."
              echo
              echo "Para habilitarlas hay que declarar el secreto"
              echo '`GDRIVE_SERVICE_ACCOUNT_JSON` y el identificador de carpeta'
              echo 'en `GDRIVE_FOLDER_ID`. El paso de ingesta ya existe.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Etapas que necesitan fotografias.
  # ---------------------------------------------------------------------------
  extraction:
    name: 3. Extraccion (Bronze)
    runs-on: ubuntu-latest
    needs: data-source
    if: needs.data-source.outputs.hay_datos == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Preparar credenciales
        run: bash scripts/02_keys_init.sh
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

      - name: Descargar las fotografias de la fuente configurada
        run: python scripts/10_ingest_images.py
        env:
          IMAGE_SOURCE: gdrive
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}

      - name: Extraer precios de las fotografias
        run: python scripts/12_extract_prices.py

      - name: Publicar capa Bronze
        uses: actions/upload-artifact@v7
        with:
          name: bronze
          path: case-studies/cs1/data/processed/bronze/
          retention-days: ${{ env.RETENTION_DAYS }}

  transform:
    name: 4. Limpieza y features (Silver / Gold)
    runs-on: ubuntu-latest
    needs: extraction
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Construir Silver y Gold
        run: python -m fuel_price_gt.cli build-data

      - name: Verificar que el conjunto de modelado existe
        run: test -s data/processed/gold/modeling_dataset.csv

      - name: Publicar datos procesados
        uses: actions/upload-artifact@v7
        with:
          name: processed-data
          path: case-studies/cs1/data/processed/
          retention-days: ${{ env.RETENTION_DAYS }}

  training:
    name: 5. Entrenamiento
    runs-on: ubuntu-latest
    needs: transform
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Descargar datos procesados
        uses: actions/download-artifact@v8
        with:
          name: processed-data
          path: case-studies/cs1/data/processed/

      - name: Entrenar modelos
        run: python -m fuel_price_gt.cli train --fuel ${{ env.FUEL }}

      - name: Publicar modelos y reporte
        uses: actions/upload-artifact@v7
        with:
          name: models-and-reports
          path: |
            case-studies/cs1/models/trained/
            case-studies/cs1/reports/
          retention-days: ${{ env.RETENTION_DAYS }}

  evaluation:
    name: 6. Evaluacion y compuerta de calidad
    runs-on: ubuntu-latest
    needs: training
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cs1-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Descargar datos procesados
        uses: actions/download-artifact@v8
        with:
          name: processed-data
          path: case-studies/cs1/data/processed/

      - name: Descargar modelos y reporte
        uses: actions/download-artifact@v8
        with:
          name: models-and-reports
          path: case-studies/cs1/

      - name: Compuerta de calidad
        run: python scripts/15_quality_gate.py

      - name: Inferencia de humo
        run: python -m fuel_price_gt.cli recommend --fuel ${{ env.FUEL }} --horizon ${{ env.HORIZON }}

      - name: Resumen de metricas
        if: always()
        run: |
          {
            echo "## Evaluacion del modelo (${{ env.FUEL }})"
            echo
            if [ -f reports/evaluacion_modelos.csv ]; then
              head -1 reports/evaluacion_modelos.csv | sed 's/^/| /; s/,/ | /g; s/$/ |/'
              head -1 reports/evaluacion_modelos.csv | sed 's/[^,]*/---/g; s/^/| /; s/,/ | /g; s/$/ |/'
              tail -n +2 reports/evaluacion_modelos.csv | sed 's/^/| /; s/,/ | /g; s/$/ |/'
            else
              echo "No se genero el reporte de evaluacion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # La imagen no necesita datos ni modelo entrenado: la prueba de humo solo
  # comprueba que el servicio levanta y responde. Por eso cuelga de la calidad
  # de codigo y no de la evaluacion, y asi se verifica en toda corrida.
  # ---------------------------------------------------------------------------
  packaging:
    name: 7. Imagen de contenedor y prueba de humo de la API
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen de produccion
        uses: docker/build-push-action@v7
        with:
          context: case-studies/cs1
          target: production
          tags: fuel-price-gt:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar la API
        run: docker run -d --rm --name gt-smoke -p 19010:8000 fuel-price-gt:ci

      - name: Verificar endpoint /health
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:19010/health; then
              echo "API respondiendo"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          docker logs gt-smoke
          exit 1

      - name: Detener contenedor
        if: always()
        run: docker stop gt-smoke || true

      # Informa, no bloquea. La mayor parte de lo que encuentra son paquetes de
      # la distribucion sin arreglo publicado: cortar el pipeline por algo que
      # nadie puede arreglar entrena a ignorar el rojo. Lo accionable se corta
      # en el flujo de publicacion, que es donde importa.
      - name: Analizar vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fuel-price-gt:ci
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Publicar el resultado en la pestana de seguridad
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: contenedor
