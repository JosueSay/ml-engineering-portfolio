[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actividad3-linear-regression"
version = "0.1.0"
description = "Pipeline de Linear Regression con calibración de hiperparámetros usando GridSearchCV"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Machine Learning Engineering", email = "ml@uvg.edu.gt"}
]
keywords = ["machine-learning", "sklearn", "regression", "pipeline", "crisp-dm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Documentation = "https://github.com/JosueSay/ml-engineering-portfolio"
Repository = "https://github.com/JosueSay/ml-engineering-portfolio"
