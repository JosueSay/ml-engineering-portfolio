[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actividad1"
version = "0.1.0"
description = "Pipeline de preparación de datos y PCA"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.0",
    "pandas",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["src"]
